<style>
:root {
  --bg: #121212;
  --ink: #EDEDED;
  --muted: #9A9A9A;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--serif);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
#grid { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
main {
  position: relative; z-index: 1;
  min-height: 100vh; min-height: 100dvh; width: 100%; max-width: 900px; margin: 0 auto;
  padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 4vw, 2rem);
  display: grid; grid-template-rows: 1fr auto 1fr auto;
  align-items: center; justify-items: center; row-gap: clamp(3rem, 10vh, 6rem);
}
.hero { grid-row: 2; width: 100%; display: flex; justify-content: center; align-items: center; }
.logo { width: min(420px, 60vw); height: auto; display: block; fill: var(--ink); }
.contact {
  grid-row: 3; align-self: start; margin-top: clamp(2rem, 8vh, 5rem);
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
}
.contact a {
  font-family: var(--serif); font-style: italic; font-size: clamp(1.125rem, 2.4vw, 1.5rem);
  color: var(--ink); text-decoration: none; letter-spacing: 0.005em; display: inline-block;
}
.contact a.contact-secondary { font-size: clamp(0.7875rem, 1.68vw, 1.05rem); color: var(--muted); }
footer {
  grid-row: 4; font-family: var(--sans); font-size: 0.6875rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); text-align: center;
}

/* ---- study panel, not part of the site ---- */
#panel {
  position: fixed; top: 16px; right: 16px; z-index: 10; width: 274px;
  background: rgba(24,24,24,0.94); border: 1px solid #2E2E2E; border-radius: 10px;
  padding: 14px 16px 16px; font-family: var(--sans); font-size: 11px; color: #CFCFCF;
  backdrop-filter: blur(8px); max-height: calc(100vh - 32px); overflow-y: auto;
}
#panel h2 {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #7A7A7A; font-weight: 500; margin-bottom: 12px;
}
#panel .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 14px; }
#panel button {
  font-family: var(--sans); font-size: 10.5px; padding: 7px 4px; cursor: pointer;
  background: #1E1E1E; color: #B4B4B4; border: 1px solid #333; border-radius: 5px;
  letter-spacing: 0.02em;
}
#panel button.on { background: #EDEDED; color: #121212; border-color: #EDEDED; }
#panel button:hover:not(.on) { background: #262626; color: #E4E4E4; }
#panel label { display: block; margin-bottom: 11px; }
#panel .row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #8E8E8E; }
#panel .row b { color: #E4E4E4; font-weight: 500; font-variant-numeric: tabular-nums; }
#panel input[type=range] { width: 100%; accent-color: #4E7BE8; height: 3px; }
#panel .sep {
  margin: 13px 0 12px; padding-top: 12px; border-top: 1px solid #2A2A2A;
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6E6E;
}
#panel .foot {
  margin-top: 12px; padding-top: 11px; border-top: 1px solid #2A2A2A;
  color: #6E6E6E; line-height: 1.5;
}
#panel .foot b { color: #B4B4B4; font-weight: 500; font-variant-numeric: tabular-nums; }
#reset {
  width: 100%; margin-top: 9px; font-size: 10px; padding: 6px 4px;
}

<div id="panel">
  <h2>Dot grid study</h2>
  <div class="modes">
    <button data-mode="radial" class="on">Radial from dot</button>
    <button data-mode="diagonal">Diagonal drift</button>
    <button data-mode="static">Static grid</button>
    <button data-mode="off">No grid</button>
  </div>

  <div class="sep">Wave thickness</div>
  <label>
    <span class="row">Band width <b id="vWave">285px</b></span>
    <input type="range" id="wave" min="50" max="600" step="5" value="285">
  </label>
  <label>
    <span class="row">Band edge <b id="vSharp">even (sine)</b></span>
    <input type="range" id="sharp" min="4" max="45" value="10">
  </label>

  <div class="sep">Grid &amp; motion</div>
  <label>
    <span class="row">Spacing <b id="vSpacing">26px</b></span>
    <input type="range" id="spacing" min="14" max="52" value="26">
  </label>
  <label>
    <span class="row">Dot size <b id="vSize">1.4px</b></span>
    <input type="range" id="size" min="6" max="30" value="14">
  </label>
  <label>
    <span class="row">Amplitude <b id="vAmp">subtle</b></span>
    <input type="range" id="amp" min="0" max="100" value="26">
  </label>
  <label>
    <span class="row">Wave speed <b id="vSpeed">9.0s</b></span>
    <input type="range" id="speed" min="20" max="200" value="90">
  </label>

  <button id="reset">reset to what is live</button>
  <div class="foot">
    <span id="stats">-</span><br>
    These are the settings currently live on the site.<br>Band width = how far apart the rings sit.<br>
    Band edge = how thin the bright part of each ring is.
  </div>
</div>

<script>
/* ---- the site's own favicon + tittle animation, unchanged ---- */
const canvas = document.createElement('canvas');
canvas.width = 32; canvas.height = 32;
const ctx = canvas.getContext('2d');
const link = document.querySelector("link[rel~='icon']");
const tittle = document.getElementById('logo-tittle');
let hue = 210;
function updateFavicon() {
  ctx.clearRect(0, 0, 32, 32);
  ctx.beginPath();
  ctx.arc(16, 16, 14, 0, Math.PI * 2);
  const color = `hsl(${hue}, 80%, 55%)`;
  ctx.fillStyle = color;
  ctx.fill();
  if (tittle) tittle.setAttribute('fill', color);
  link.href = canvas.toDataURL('image/png');
  hue = (hue + 1) % 360;
}
setInterval(updateFavicon, 150);
updateFavicon();

/* ---- the study: dot grid ---- */
const cv = document.getElementById('grid');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

const DEFAULTS = { mode: 'radial', wavelength: 285, sharp: 1.0, spacing: 26, size: 1.4, amp: 0.26, period: 9.0 };
const cfg = Object.assign({}, DEFAULTS);
const BASE = 0.030, RANGE = 0.055, BUCKETS = 14;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

function source() {
  const t = document.getElementById('logo-tittle');
  if (!t) return { x: W / 2, y: H / 2 };
  const r = t.getBoundingClientRect();
  return { x: r.x + r.width / 2, y: r.y + r.height / 2 };
}

let frames = 0, fps = 0, last = performance.now(), dotCount = 0;

function draw(now) {
  requestAnimationFrame(draw);
  const dt = now - last;
  frames++;
  if (dt > 500) {
    fps = Math.round(frames * 1000 / dt); frames = 0; last = now;
    document.getElementById('stats').innerHTML =
      '<b>' + dotCount + '</b> dots &middot; <b>' + fps + '</b> fps';
  }

  g.clearRect(0, 0, W, H);
  if (cfg.mode === 'off') { dotCount = 0; return; }

  const s = cfg.spacing;
  const src = source();
  const phase = now * ((2 * Math.PI) / (cfg.period * 1000));
  const lam = cfg.wavelength;
  const k = cfg.sharp;

  const buckets = Array.from({ length: BUCKETS }, () => []);
  let n = 0;
  for (let y = s / 2; y < H; y += s) {
    for (let x = s / 2; x < W; x += s) {
      let v = 0.5;
      if (cfg.mode === 'radial') {
        const d = Math.hypot(x - src.x, y - src.y);
        v = 0.5 + 0.5 * Math.sin((d / lam) * Math.PI * 2 - phase);
      } else if (cfg.mode === 'diagonal') {
        v = 0.5 + 0.5 * Math.sin(((x + y) / lam) * Math.PI * 2 - phase);
      }
      // band edge: k > 1 squeezes the bright part into a thinner ring, k < 1 broadens it
      if (cfg.mode !== 'static' && k !== 1) v = Math.pow(v, k);
      const b = Math.min(BUCKETS - 1, Math.floor(v * BUCKETS));
      buckets[b].push(x, y);
      n++;
    }
  }
  dotCount = n;

  for (let b = 0; b < BUCKETS; b++) {
    const pts = buckets[b];
    if (!pts.length) continue;
    const v = (b + 0.5) / BUCKETS;
    const alpha = BASE + RANGE * (cfg.mode === 'static' ? 0.5 : (0.5 + (v - 0.5) * 2 * cfg.amp));
    g.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(4) + ')';
    g.beginPath();
    for (let i = 0; i < pts.length; i += 2) {
      g.moveTo(pts[i] + cfg.size, pts[i + 1]);
      g.arc(pts[i], pts[i + 1], cfg.size, 0, Math.PI * 2);
    }
    g.fill();
  }
}

/* ---- controls ---- */
const $ = id => document.getElementById(id);

function sharpWord(k) {
  return k < 0.8 ? 'broad bands' : k <= 1.25 ? 'even (sine)' : k <= 2.2 ? 'tighter rings' : 'thin rings';
}
function ampWord(a) {
  return a === 0 ? 'flat' : a < 0.2 ? 'barely there' : a < 0.4 ? 'subtle' : a < 0.7 ? 'visible' : 'strong';
}

function paintLabels() {
  $('vWave').textContent = cfg.wavelength + 'px';
  $('vSharp').textContent = sharpWord(cfg.sharp);
  $('vSpacing').textContent = cfg.spacing + 'px';
  $('vSize').textContent = cfg.size.toFixed(1) + 'px';
  $('vAmp').textContent = ampWord(cfg.amp);
  $('vSpeed').textContent = cfg.period.toFixed(1) + 's';
}
function paintInputs() {
  $('wave').value = cfg.wavelength;
  $('sharp').value = Math.round(cfg.sharp * 10);
  $('spacing').value = cfg.spacing;
  $('size').value = Math.round(cfg.size * 10);
  $('amp').value = Math.round(cfg.amp * 100);
  $('speed').value = Math.round(cfg.period * 10);
}

document.querySelectorAll('#panel button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#panel button[data-mode]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    cfg.mode = btn.dataset.mode;
  });
});

$('wave').addEventListener('input', e => { cfg.wavelength = +e.target.value; paintLabels(); });
$('sharp').addEventListener('input', e => { cfg.sharp = +e.target.value / 10; paintLabels(); });
$('spacing').addEventListener('input', e => { cfg.spacing = +e.target.value; paintLabels(); });
$('size').addEventListener('input', e => { cfg.size = +e.target.value / 10; paintLabels(); });
$('amp').addEventListener('input', e => { cfg.amp = +e.target.value / 100; paintLabels(); });
$('speed').addEventListener('input', e => { cfg.period = +e.target.value / 10; paintLabels(); });

$('reset').addEventListener('click', () => {
  Object.assign(cfg, DEFAULTS);
  document.querySelectorAll('#panel button[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === cfg.mode));
  paintInputs(); paintLabels();
});

paintInputs();
paintLabels();
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
